pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: '*.{js,ts,jsx,tsx,json,css}'
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

pre-push:
  parallel: false
  jobs:
    - name: lint
      run: pnpm lint
    - name: typecheck
      run: pnpm typecheck
    - name: test
      run: pnpm test
    - name: build
      run: pnpm build
